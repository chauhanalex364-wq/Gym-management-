<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#070707" />
<title>EnterGym — Gym Management</title>
<style>
:root{--bg:#050505;--surface:#0b0b0c;--surface2:#101012;--surface3:#151517;--line:#252529;--line2:#303035;--text:#f7f7f8;--muted:#95959b;--muted2:#68686e;--accent:#fff;--success:#a7f3cf;--warning:#ffe1a8;--danger:#ffadad;--shadow:0 30px 100px rgba(0,0,0,.5);--r:18px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 18% -10%,#262626 0,#090909 32%,#050505 70%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh;display:grid;place-items:center;padding:18px}.panel{width:min(1420px,100%);background:rgba(11,11,12,.96);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.btn{border:1px solid var(--line2);background:var(--surface3);color:var(--text);border-radius:12px;padding:10px 13px;font-weight:760;transition:.18s ease;white-space:nowrap}.btn:hover{transform:translateY(-1px);border-color:#44444a}.btn.primary{background:#fff;color:#050505;border-color:#fff}.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#808087}.muted{color:var(--muted);font-size:12px;line-height:1.6}.logo{width:44px;height:44px;border-radius:14px;background:#fff;color:#000;display:grid;place-items:center;font-weight:950;letter-spacing:-.05em}.gate{width:min(560px,100%);padding:34px}.gate h1{font-size:42px;line-height:1.03;margin:12px 0}.gate .lead{max-width:470px}.code-row{display:flex;gap:9px;margin-top:24px}.code-row input{flex:1;background:#080809;border:1px solid #2b2b30;border-radius:13px;color:#fff;padding:14px;letter-spacing:.3em;text-transform:uppercase;font-weight:850}.hint{margin-top:10px;color:#6f6f75;font-size:11px}.error{min-height:18px;margin-top:8px;color:var(--danger);font-size:11px}.feature-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:28px}.mini-card{border:1px solid var(--line);border-radius:14px;padding:12px;background:#0a0a0b}.mini-card b{display:block;font-size:12px;margin-bottom:4px}.mini-card span{font-size:10px;color:#77777d}
.onboard{width:min(920px,100%)}.on-head{padding:26px 28px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.on-head h2{font-size:24px;margin:5px 0 0}.stepper{display:flex;gap:8px;padding:16px 28px;border-bottom:1px solid var(--line)}.step{height:5px;flex:1;background:#202024;border-radius:999px}.step.on{background:#fff}.step.done{background:#73737a}.on-body{padding:30px;min-height:460px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:22px}.field label{display:block;color:#a8a8ae;font-size:10px;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;background:#09090a;color:#fff;border:1px solid #29292e;border-radius:12px;padding:12px;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#777}.full{grid-column:1/-1}.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:22px}.plan-card{padding:16px;border:1px solid #28282c;border-radius:15px;background:#09090a;transition:.18s ease}.plan-card:hover{transform:translateY(-2px)}.plan-card.selected{border-color:#fff;box-shadow:inset 0 0 0 1px #fff}.plan-card h3{margin:0}.price{font-weight:900;font-size:30px;margin:8px 0}.on-foot{display:flex;justify-content:space-between;gap:10px;padding:17px 28px;border-top:1px solid var(--line)}
.shell{min-height:820px;display:grid;grid-template-columns:248px 1fr}.sidebar{padding:18px 15px;background:#080809;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 20px}.brand b{font-size:15px}.brand small{display:block;color:#74747a;font-size:10px;margin-top:2px}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:#99999f;border-radius:11px;padding:11px 12px;text-align:left;font-weight:680;display:flex;align-items:center;gap:10px}.nav button.active,.nav button:hover{background:#151517;border-color:#252529;color:#fff}.nav-icon{width:21px;text-align:center}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.profile{display:flex;gap:9px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:14px;background:#0f0f10}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#fff,#777);color:#000;font-weight:900}.profile b{font-size:11px}.profile small{display:block;color:#77777e;font-size:9px;margin-top:2px}.content{padding:22px 24px;background:linear-gradient(180deg,#0e0e10,#0a0a0b);overflow:auto}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.topbar h1{font-size:28px;margin:3px 0 0}.actions{display:flex;gap:8px}.page{display:none}.page.active{display:block}.grid{display:grid;gap:13px}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.45fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:#111113;border:1px solid var(--line);border-radius:17px;padding:16px}.card h3{margin:0 0 12px;font-size:13px}.stat .label{font-size:10px;color:#85858b}.stat .value{font-size:29px;font-weight:900;margin-top:6px}.stat .sub{font-size:9px;color:var(--success);margin-top:5px}.chart{height:240px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:11px;min-width:620px}.table th,.table td{padding:10px 8px;text-align:left;border-bottom:1px solid #1f1f22}.table th{color:#707077;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.pill{display:inline-flex;align-items:center;padding:4px 7px;border:1px solid #303035;border-radius:999px;font-size:9px}.pill.good{color:var(--success)}.pill.warn{color:var(--warning)}.split{display:flex;justify-content:space-between;align-items:center;gap:10px}.bar-list{display:grid;gap:12px}.bar-row{display:grid;grid-template-columns:84px 1fr 34px;align-items:center;gap:8px;font-size:10px;color:#96969c}.bar{height:8px;background:#1c1c1f;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:#fff}.quick{display:grid;gap:9px}.qr-box{text-align:center;padding:16px;background:#0a0a0b;border:1px solid #252529;border-radius:14px}.qr-code{font-size:29px;font-weight:900;letter-spacing:.2em;margin-top:8px}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(7px);display:grid;place-items:center;padding:16px;z-index:20}.modal{width:min(650px,100%);background:#0e0e10;border:1px solid #303035;border-radius:20px;box-shadow:var(--shadow);padding:20px}.toast{position:fixed;right:18px;bottom:18px;background:#fff;color:#000;padding:11px 14px;border-radius:12px;font-size:11px;font-weight:800;z-index:30}.empty{padding:30px;text-align:center;color:#777;font-size:11px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.settings-grid .card{min-height:100%}.metric-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid #202024;font-size:11px}.mobile-bar{display:none}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.sidebar{display:none}.mobile-bar{display:flex;position:sticky;bottom:0;z-index:8;background:#0a0a0b;border-top:1px solid var(--line);padding:8px;gap:6px}.mobile-bar button{flex:1;border:0;background:transparent;color:#84848a;padding:8px;font-size:9px}.mobile-bar button.active{color:#fff;background:#171719;border-radius:10px}.stats{grid-template-columns:1fr 1fr}.two,.three,.settings-grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.app{padding:7px}.panel{border-radius:20px}.gate{padding:24px}.gate h1{font-size:32px}.feature-strip{grid-template-columns:1fr}.code-row{flex-direction:column}.on-head,.stepper,.on-foot{padding-left:20px;padding-right:20px}.on-body{padding:22px}.form-grid,.plan-grid,.stats,.two,.three,.settings-grid{grid-template-columns:1fr}.full{grid-column:auto}.topbar{flex-direction:column}.actions{width:100%;overflow:auto}.content{padding:16px}.card{padding:14px}}
</style></head>
<body>
<div id="root"></div>
<script>
const ACTIVATION='9A2L6E';
const KEY='entergym_single_v2';
const defaultState={screen:'gate',step:1,gym:{name:'',location:'',phone:'',capacity:300},owner:{name:'',email:'',phone:''},gymCode:'482631',plan:{name:'Pro',price:1000,duration:30,description:'Full gym access + standard support'},members:[],attendance:[]};
let S=loadState();
function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultState)}catch{return structuredClone(defaultState)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function initials(v){return (v||'Owner').split(/\s+/).filter(Boolean).map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function today(){return new Date().toISOString().slice(0,10)}
function genCode(){let c;do{c=String(Math.floor(100000+Math.random()*900000))}while(c===S.gymCode);return c}
function plans(){const base=[{name:'Starter',price:799,duration:30,description:'Core access + basic attendance'},{name:'Pro',price:1000,duration:30,description:'Full gym access + standard support'},{name:'Elite',price:1499,duration:30,description:'All access + priority support'}];return base.concat(Object.values(S.customPlans||{}).filter(p=>!base.some(b=>b.name===p.name)))}
function render(){if(S.screen==='gate')renderGate();else if(S.screen==='onboard')renderOnboard();else renderDashboard()}
function renderGate(){root.innerHTML=`<div class="app"><div class="panel gate"><div class="logo">EG</div><div class="eyebrow" style="margin-top:18px">ENTERGYM · GYM OPERATING SYSTEM</div><h1>Run your gym<br>with clarity.</h1><p class="muted lead">A focused owner workspace for members, plans, attendance, revenue and daily operations — in one place.</p><div class="code-row"><input id="codeInput" maxlength="6" placeholder="ENTER CODE" autocomplete="off"/><button class="btn primary" onclick="submitCode()">Continue</button></div><div id="codeErr" class="error"></div><div class="hint">New gym activation code: <b>${ACTIVATION}</b> · Existing owners can sign in with their 6-digit gym code.</div><div class="feature-strip"><div class="mini-card"><b>Members</b><span>CRUD + plan tracking</span></div><div class="mini-card"><b>Attendance</b><span>Manual + QR check-in</span></div><div class="mini-card"><b>Insights</b><span>Live owner analytics</span></div></div></div></div>`}
function submitCode(){const v=($('#codeInput').value||'').trim().toUpperCase();$('#codeErr').textContent='';if(v===ACTIVATION){S.screen='onboard';S.step=1;S.temp={plan:structuredClone(S.plan||{name:'Pro',price:1000,duration:30,description:'Full gym access + standard support'})};render();return}if(/^\d{6}$/.test(v)&&S.gym.name&&S.gymCode===v){delete S.temp;S.screen='dashboard';render();toast('Welcome back');return}$('#codeErr').textContent='Invalid code. Use 9A2L6E for new gym activation or your 6-digit gym code.'}
function renderOnboard(){const d=S;const bodies=[
`<div class="eyebrow">STEP 1 OF 4</div><h2>Tell us about your gym</h2><p class="muted">These details power the owner workspace and member records.</p><div class="form-grid"><div class="field full"><label>Gym name</label><input id="gname" value="${esc(d.gym.name)}" placeholder="Iron House Fitness"></div><div class="field"><label>Location</label><input id="gloc" value="${esc(d.gym.location)}" placeholder="City, Area"></div><div class="field"><label>Gym phone</label><input id="gphone" value="${esc(d.gym.phone)}" placeholder="+91 98xxxxxx"></div><div class="field"><label>Member capacity</label><input id="gcap" type="number" value="${d.gym.capacity}"></div></div>`,
`<div class="eyebrow">STEP 2 OF 4</div><h2>Set up the owner profile</h2><p class="muted">This is the identity shown inside your app.</p><div class="form-grid"><div class="field full"><label>Owner name</label><input id="oname" value="${esc(d.owner.name)}" placeholder="Alex Chauhan"></div><div class="field"><label>Email</label><input id="oemail" value="${esc(d.owner.email)}" placeholder="owner@gym.com"></div><div class="field"><label>Phone</label><input id="ophone" value="${esc(d.owner.phone)}" placeholder="+91 9xxxxxxx"></div></div>`,
`<div class="eyebrow">STEP 3 OF 4</div><h2>Create your first plan</h2><p class="muted">Start with a template; custom plans can be added anytime later.</p><div class="plan-grid">${plans().map(p=>`<div class="plan-card ${d.plan?.name===p.name?'selected':''}" onclick="pickPlan('${p.name}')"><div class="eyebrow">${p.name}</div><div class="price">${money(p.price)}<span style="font-size:10px;color:#777;font-weight:500"> / month</span></div><div class="muted">${p.description}</div></div>`).join('')}</div>`,
`<div class="eyebrow">STEP 4 OF 4</div><h2>Add your first member</h2><p class="muted">A real member record will be created in this browser demo.</p><div class="form-grid"><div class="field full"><label>Member name</label><input id="mname" value="" placeholder="Rahul Sharma"></div><div class="field"><label>Phone</label><input id="mphone" placeholder="+91 98xxxxxx"></div><div class="field"><label>Start date</label><input id="mstart" type="date" value="${today()}"></div></div><div style="margin-top:20px;padding:15px;border:1px solid #25342d;border-radius:14px;background:#0d1712"><b style="font-size:12px">Almost ready.</b><div class="muted" style="margin-top:4px">After launch you will receive a unique 6-digit gym code and access to the complete owner dashboard.</div></div>`];
root.innerHTML=`<div class="app"><div class="panel onboard"><div class="on-head"><div><div class="eyebrow">ENTERGYM SETUP</div><h2>${['Gym details','Owner profile','First membership plan','First member'][d.step-1]}</h2></div><div class="muted">Step ${d.step} of 4</div></div><div class="stepper">${[1,2,3,4].map(i=>`<div class="step ${i<d.step?'done':i===d.step?'on':''}"></div>`).join('')}</div><div class="on-body">${bodies[d.step-1]}</div><div class="on-foot"><button class="btn ghost" onclick="backStep()">${d.step===1?'Exit':'Back'}</button><button class="btn primary" onclick="nextStep()">${d.step===4?'Launch dashboard':'Continue'}</button></div></div></div>`}
function pickPlan(n){S.plan=structuredClone(plans().find(p=>p.name===n));save();render()}
function nextStep(){const s=S.step;if(s===1){S.gym={name:$('#gname').value.trim(),location:$('#gloc').value.trim(),phone:$('#gphone').value.trim(),capacity:Number($('#gcap').value)||300};if(!S.gym.name)return toast('Enter your gym name')}else if(s===2){S.owner={name:$('#oname').value.trim(),email:$('#oemail').value.trim(),phone:$('#ophone').value.trim()};if(!S.owner.name)return toast('Enter your owner name')}else if(s===4){const m={id:crypto.randomUUID(),name:$('#mname').value.trim(),phone:$('#mphone').value.trim(),planId:S.plan?.name||'Pro',start:$('#mstart').value||today(),status:'active'};if(!m.name)return toast('Enter member name');S.members=[m];S.screen='dashboard';S.step=1;S.gymCode=genCode();delete S.temp;save();render();toast('Gym launched successfully');return}S.step++;save();render()}
function backStep(){if(S.step===1){S.screen='gate';render()}else{S.step--;render()}}
function nav(tab){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('#p-'+tab).classList.add('active');document.querySelectorAll('.nav button,.mobile-bar button').forEach(x=>x.classList.remove('active'));document.querySelectorAll(`[data-nav="${tab}"]`).forEach(x=>x.classList.add('active'));$('#pageTitle').textContent=tab[0].toUpperCase()+tab.slice(1)}
function membersActive(){return S.members.filter(m=>m.status==='active')}
function revenue(){return membersActive().reduce((n,m)=>n+(plans().find(p=>p.name===m.planId)?.price||S.plan?.price||1000),0)}
function renderDashboard(){root.innerHTML=`<div class="app"><div class="panel shell"><aside class="sidebar"><div class="brand"><div class="logo">EG</div><div><b>EnterGym</b><small>Owner workspace</small></div></div><div class="nav">${[['overview','⌂'],['members','◉'],['plans','▣'],['attendance','◷'],['payments','₹'],['settings','⚙']].map(([n,i])=>`<button data-nav="${n}" class="${n==='overview'?'active':''}" onclick="nav('${n}')"><span class="nav-icon">${i}</span>${n[0].toUpperCase()+n.slice(1)}</button>`).join('')}</div><div class="side-bottom"><div class="profile"><div class="avatar">${initials(S.owner.name)}</div><div><b>${esc(S.owner.name||'Owner')}</b><small>${esc(S.gymCode)} · Gym Owner</small></div></div><button class="btn" style="width:100%;margin-top:8px" onclick="logout()">Log out</button></div></aside><main class="content"><div class="topbar"><div><div class="eyebrow">${esc(S.gym.name)} · ${esc(S.gymCode)}</div><h1 id="pageTitle">Overview</h1></div><div class="actions"><button class="btn" onclick="openQR()">Attendance QR</button><button class="btn primary" onclick="nav('members');openMember()">+ Add member</button></div></div>${pageOverview()}${pageMembers()}${pagePlans()}${pageAttendance()}${pagePayments()}${pageSettings()}</main><div class="mobile-bar">${['overview','members','plans','attendance','payments','settings'].map(n=>`<button data-nav="${n}" class="${n==='overview'?'active':''}" onclick="nav('${n}')">${n[0].toUpperCase()+n.slice(1)}</button>`).join('')}</div></div></div>`;nav('overview')}
function pageOverview(){const active=membersActive().length, rev=revenue(), cap=Math.max(1,Number(S.gym.capacity)||300), pct=Math.min(100,Math.round(active/cap*100)), att= S.attendance.filter(a=>a.date===today()).length;const vals=[18,25,20,38,34,48,att];const mx=Math.max(1,...vals);return `<section id="p-overview" class="page active"><div class="grid stats"><div class="card stat"><div class="label">Active members</div><div class="value">${active}</div><div class="sub">Live member records</div></div><div class="card stat"><div class="label">Monthly revenue</div><div class="value">${money(rev)}</div><div class="sub">Based on active plans</div></div><div class="card stat"><div class="label">Today’s check-ins</div><div class="value">${att}</div><div class="sub">Manual + QR attendance</div></div><div class="card stat"><div class="label">Capacity used</div><div class="value">${pct}%</div><div class="sub">${Math.max(0,cap-active)} spots available</div></div></div><div style="height:13px"></div><div class="grid two"><div class="card"><div class="split"><h3>Attendance trend</h3><span class="muted">Last 7 days</span></div><div class="chart"><svg viewBox="0 0 700 240" preserveAspectRatio="none" width="100%" height="100%"><g stroke="#202024">${[30,80,130,180,230].map(y=>`<line x1="0" x2="700" y1="${y}" y2="${y}"/>`).join('')}</g><polyline points="${vals.map((v,i)=>`${i*116.6},${225-(v/mx)*185}`).join(' ')}" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${i*116.6}" cy="${225-(v/mx)*185}" r="4" fill="#fff"/>`).join('')}</svg></div><div class="muted">Mon · Tue · Wed · Thu · Fri · Sat · Sun</div></div><div class="card"><div class="split"><h3>Plan mix</h3><span class="muted">${active} active</span></div><div class="bar-list">${plans().map(p=>{const c=S.members.filter(m=>m.planId===p.name&&m.status==='active').length;return `<div class="bar-row"><span>${p.name}</span><div class="bar"><i style="width:${Math.round(c/Math.max(1,active)*100)}%"></i></div><b>${c}</b></div>`}).join('')}</div><div class="qr-box" style="margin-top:18px"><div class="eyebrow">GYM CODE</div><div class="qr-code">${esc(S.gymCode)}</div><div class="muted">Use this code to sign in from another device.</div></div></div></div><div style="height:13px"></div><div class="grid three"><div class="card"><h3>Recent members</h3>${S.members.slice(-5).reverse().map(m=>`<div class="metric-row"><span>${esc(m.name)}<small style="display:block;color:#6f6f75;margin-top:2px">${esc(m.planId)}</small></span><span class="pill good">${m.status}</span></div>`).join('')||'<div class="empty">No members yet.</div>'}</div><div class="card"><h3>Quick actions</h3><div class="quick"><button class="btn" onclick="nav('members');openMember()">+ Add member</button><button class="btn" onclick="nav('plans');openPlan()">+ Create plan</button><button class="btn" onclick="openQR()">▣ Attendance QR</button></div></div><div class="card"><h3>Owner profile</h3><div class="metric-row"><span>Name</span><b>${esc(S.owner.name||'—')}</b></div><div class="metric-row"><span>Email</span><b>${esc(S.owner.email||'—')}</b></div><div class="metric-row"><span>Phone</span><b>${esc(S.owner.phone||'—')}</b></div></div></div></section>`}
function pageMembers(){return `<section id="p-members" class="page"><div class="card"><div class="split"><div><h3>Members</h3><div class="muted">Manage active members, plans and check-ins.</div></div><button class="btn primary" onclick="openMember()">+ Add member</button></div><div class="table-wrap" style="margin-top:15px"><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Plan</th><th>Start</th><th>Status</th><th>Actions</th></tr></thead><tbody>${S.members.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.phone)}</td><td>${esc(m.planId)}</td><td>${esc(m.start)}</td><td><span class="pill ${m.status==='active'?'good':'warn'}">${m.status}</span></td><td><button class="btn" onclick="checkIn('${m.id}')">Check in</button> <button class="btn" onclick="openMember('${m.id}')">Edit</button> <button class="btn danger" onclick="removeMember('${m.id}')">Delete</button></td></tr>`).join('')||`<tr><td colspan="6"><div class="empty">No members yet. Add your first member.</div></td></tr>`}</tbody></table></div></div></section>`}
function pagePlans(){return `<section id="p-plans" class="page"><div class="split" style="margin-bottom:13px"><div><h3 style="margin:0">Membership plans</h3><div class="muted">Build pricing that matches your gym.</div></div><button class="btn primary" onclick="openPlan()">+ Create custom plan</button></div><div class="grid three">${plans().map(p=>`<div class="card"><div class="eyebrow">${p.duration} DAYS</div><h3 style="margin-top:8px">${esc(p.name)}</h3><div class="price">${money(p.price)}</div><div class="muted">${esc(p.description)}</div><div style="margin-top:14px"><button class="btn" onclick="openPlan('${p.name}')">Edit</button> <button class="btn" onclick="toast('Template plans are protected in this demo')">Delete</button></div></div>`).join('')}</div><div class="card" style="margin-top:13px"><h3>Current default</h3><div class="metric-row"><span>Plan</span><b>${esc(S.plan?.name||'Pro')}</b></div><div class="metric-row"><span>Price</span><b>${money(S.plan?.price||1000)} / month</b></div></div></section>`}
function pageAttendance(){return `<section id="p-attendance" class="page"><div class="grid two"><div class="card"><div class="split"><h3>Attendance log</h3><button class="btn primary" onclick="openQR()">Generate QR</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Method</th><th>Date</th><th>Time</th></tr></thead><tbody>${S.attendance.slice().reverse().map(a=>`<tr><td>${esc(S.members.find(m=>m.id===a.memberId)?.name||'Unknown')}</td><td>${esc(a.method)}</td><td>${esc(a.date)}</td><td>${esc(a.time)}</td></tr>`).join('')||`<tr><td colspan="4"><div class="empty">No attendance records yet.</div></td></tr>`}</tbody></table></div></div><div class="card"><h3>Today</h3><div class="value" style="font-size:48px">${S.attendance.filter(a=>a.date===today()).length}</div><div class="muted">Check-ins recorded today</div><button class="btn primary" style="margin-top:16px" onclick="nav('members')">Open member check-in</button></div></div></section>`}
function pagePayments(){return `<section id="p-payments" class="page"><div class="grid three"><div class="card"><div class="muted">MRR</div><div class="value">${money(revenue())}</div></div><div class="card"><div class="muted">Active subscriptions</div><div class="value">${membersActive().length}</div></div><div class="card"><div class="muted">Average revenue / member</div><div class="value">${money(membersActive().length?Math.round(revenue()/membersActive().length):0)}</div></div></div><div class="card" style="margin-top:13px"><h3>Payments module</h3><p class="muted">This MVP calculates revenue from active memberships. A production release can connect Razorpay/Stripe webhooks and payment receipts without changing the dashboard UX.</p></div></section>`}
function pageSettings(){return `<section id="p-settings" class="page"><div class="settings-grid"><div class="card"><h3>Gym profile</h3><div class="form-grid"><div class="field full"><label>Gym name</label><input id="sn" value="${esc(S.gym.name)}"></div><div class="field"><label>Location</label><input id="sl" value="${esc(S.gym.location)}"></div><div class="field"><label>Phone</label><input id="sp" value="${esc(S.gym.phone)}"></div><div class="field"><label>Capacity</label><input id="sc" type="number" value="${S.gym.capacity}"></div></div><button class="btn primary" style="margin-top:14px" onclick="saveGym()">Save gym profile</button></div><div class="card"><h3>Owner profile</h3><div class="form-grid"><div class="field full"><label>Name</label><input id="son" value="${esc(S.owner.name)}"></div><div class="field"><label>Email</label><input id="soe" value="${esc(S.owner.email)}"></div><div class="field"><label>Phone</label><input id="sop" value="${esc(S.owner.phone)}"></div></div><button class="btn primary" style="margin-top:14px" onclick="saveOwner()">Save owner profile</button></div><div class="card"><h3>Gym access code</h3><div class="eyebrow">UNIQUE 6-DIGIT CODE</div><div style="font-size:36px;font-weight:950;letter-spacing:.18em;margin:6px 0 12px">${esc(S.gymCode)}</div><div class="muted">Regenerate this code if you need to revoke the previous login code.</div><button class="btn" style="margin-top:12px" onclick="regenCode()">Generate new code</button></div><div class="card"><h3>Session</h3><div class="muted">Your owner data is stored locally in this browser for the single-file demo.</div><button class="btn danger" style="margin-top:12px" onclick="logout()">Log out</button></div></div></section>`}
function openModal(html){closeModal();document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modalBack"><div class="modal">${html}</div></div>`)}function closeModal(){document.getElementById('modalBack')?.remove()}
function openMember(id=''){const m=S.members.find(x=>x.id===id);openModal(`<div class="split"><div><div class="eyebrow">MEMBER</div><h3 style="font-size:20px;margin:5px 0">${m?'Edit member':'Add member'}</h3></div><button class="btn" onclick="closeModal()">×</button></div><div class="form-grid" style="margin-top:18px"><div class="field full"><label>Name</label><input id="mmn" value="${esc(m?.name)}" placeholder="Member name"></div><div class="field"><label>Phone</label><input id="mmp" value="${esc(m?.phone)}" placeholder="+91..."></div><div class="field"><label>Plan</label><select id="mmpn">${plans().map(p=>`<option value="${p.name}" ${m?.planId===p.name?'selected':''}>${p.name} · ${money(p.price)}</option>`).join('')}</select></div><div class="field"><label>Start date</label><input id="mmd" type="date" value="${esc(m?.start||today())}"></div><div class="field"><label>Status</label><select id="mms"><option ${m?.status!=='inactive'?'selected':''}>active</option><option ${m?.status==='inactive'?'selected':''}>inactive</option></select></div></div><div style="margin-top:16px"><button class="btn primary" onclick="saveMember('${id}')">Save member</button> <button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function saveMember(id){const name=$('#mmn').value.trim();if(!name)return toast('Enter member name');const x={id:id||crypto.randomUUID(),name,phone:$('#mmp').value.trim(),planId:$('#mmpn').value,start:$('#mmd').value||today(),status:$('#mms').value};if(id)S.members=S.members.map(m=>m.id===id?x:m);else S.members.push(x);save();closeModal();renderDashboard();nav('members');toast(id?'Member updated':'Member added')}
function removeMember(id){if(!confirm('Delete this member?'))return;S.members=S.members.filter(m=>m.id!==id);S.attendance=S.attendance.filter(a=>a.memberId!==id);save();renderDashboard();nav('members');toast('Member deleted')}
function checkIn(id){const m=S.members.find(x=>x.id===id);if(!m)return;const d=today();if(S.attendance.some(a=>a.memberId===id&&a.date===d)){toast('Attendance already marked today');return}const now=new Date();S.attendance.push({id:crypto.randomUUID(),memberId:id,date:d,time:now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),method:'owner'});save();renderDashboard();nav('attendance');toast(`${m.name} checked in`)}
function openPlan(name=''){const p=plans().find(x=>x.name===name);openModal(`<div class="split"><div><div class="eyebrow">PLAN BUILDER</div><h3 style="font-size:20px;margin:5px 0">${name?'Edit plan':'Create custom plan'}</h3></div><button class="btn" onclick="closeModal()">×</button></div><div class="form-grid" style="margin-top:18px"><div class="field"><label>Plan name</label><input id="pn" value="${esc(p?.name)}" placeholder="Gold"></div><div class="field"><label>Price ₹ / month</label><input id="pp" type="number" value="${p?.price||1200}"></div><div class="field"><label>Duration days</label><input id="pd" type="number" value="${p?.duration||30}"></div><div class="field full"><label>Description</label><textarea id="px" placeholder="What is included?">${esc(p?.description)}</textarea></div></div><div style="margin-top:16px"><button class="btn primary" onclick="savePlan('${name}')">Save plan</button> <button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function savePlan(name){const pn=$('#pn').value.trim();if(!pn)return toast('Enter plan name');const p={name:pn,price:Number($('#pp').value)||0,duration:Number($('#pd').value)||30,description:$('#px').value.trim()};if(name){S.members=S.members.map(m=>m.planId===name?({...m,planId:pn}):m);if(S.plan?.name===name)S.plan=p}else{S.plan=p}S.customPlans=S.customPlans||{};S.customPlans[pn]=p;save();closeModal();renderDashboard();nav('plans');toast('Plan saved')}
function openQR(){const url=location.origin+location.pathname.replace(/[^/]*$/,'')+'#attendance='+encodeURIComponent(S.gymCode);openModal(`<div class="split"><div><div class="eyebrow">ATTENDANCE QR</div><h3 style="font-size:20px;margin:5px 0">Scan to check in</h3></div><button class="btn" onclick="closeModal()">×</button></div><div class="qr-box" style="margin-top:18px"><canvas id="qrCanvas" width="240" height="240" style="background:#fff;border-radius:10px"></canvas><div class="qr-code">${esc(S.gymCode)}</div><div class="muted">Demo QR target: this browser's attendance flow.</div></div><div style="margin-top:14px"><button class="btn primary" onclick="copyQRLink()">Copy attendance link</button></div>`);drawQR(document.getElementById('qrCanvas'),S.gymCode)}
function copyQRLink(){navigator.clipboard?.writeText(location.href.split('#')[0]+'#attendance='+S.gymCode);toast('Attendance link copied')}
function drawQR(canvas,text){const ctx=canvas.getContext('2d'),n=25,w=canvas.width/n;ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#000';let seed=0;for(const c of text)seed=(seed*31+c.charCodeAt(0))>>>0;function rnd(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)/4294967296}for(let y=0;y<n;y++)for(let x=0;x<n;x++){let on=rnd()>.57;if((x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8)){const ax=x<7?x:x>n-8?x-(n-7):x,ay=y<7?y:y>n-8?y-(n-7):y;on=ax===0||ax===6||ay===0||ay===6||(ax>1&&ax<5&&ay>1&&ay<5)}if(on)ctx.fillRect(Math.round(x*w),Math.round(y*w),Math.ceil(w),Math.ceil(w))}}
function saveGym(){S.gym={...S.gym,name:$('#sn').value.trim(),location:$('#sl').value.trim(),phone:$('#sp').value.trim(),capacity:Number($('#sc').value)||300};save();renderDashboard();nav('settings');toast('Gym profile saved')}
function saveOwner(){S.owner={name:$('#son').value.trim(),email:$('#soe').value.trim(),phone:$('#sop').value.trim()};save();renderDashboard();nav('settings');toast('Owner profile saved')}
function regenCode(){S.gymCode=genCode();save();renderDashboard();nav('settings');toast('New 6-digit code generated')}
function logout(){S.screen='gate';save();render();toast('Logged out')}
render();
</script></body></html>
