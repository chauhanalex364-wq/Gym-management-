 <!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>EnterGym — Gym Management</title>
<style>
:root{
  --bg:#050505;--panel:#0b0b0d;--panel2:#111114;--panel3:#17171a;
  --line:#27272d;--line2:#34343b;--text:#f7f7f8;--muted:#94949c;--soft:#6b6b73;
  --good:#a7f3cf;--warn:#ffe2aa;--danger:#ffb2b2;--r:18px;
  --shadow:0 28px 100px rgba(0,0,0,.48);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
 radial-gradient(circle at 12% -10%,#2a2a2a 0,#080808 34%,#040404 74%);
 color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.hidden{display:none!important}
.app{min-height:100vh;display:grid;place-items:center;padding:18px}
.surface{width:min(1460px,100%);background:rgba(10,10,12,.965);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
.btn{border:1px solid var(--line2);background:var(--panel3);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:800;transition:transform .18s,border-color .18s,background .18s}
.btn:hover{transform:translateY(-1px);border-color:#505058}
.btn.primary{background:#fff;color:#050505;border-color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:#111114;color:#fff;border-radius:11px}
.kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#77777e}
.muted{font-size:12px;line-height:1.65;color:var(--muted)}
.logo{width:46px;height:46px;border-radius:14px;background:#fff;color:#000;display:grid;place-items:center;font-weight:950;letter-spacing:-.06em}

/* gate */
.gate{width:min(580px,100%);padding:36px}
.gate h1{font-size:44px;line-height:1.02;margin:13px 0}
.code-wrap{position:relative;margin-top:25px}
.code-row{display:flex;gap:9px}
.code-row input{flex:1;min-width:0;background:#08080a;border:1px solid #303036;color:#fff;border-radius:13px;padding:14px;letter-spacing:.32em;text-transform:uppercase;font-weight:900;outline:none}
.code-row input:focus{border-color:#787880;box-shadow:0 0 0 3px #ffffff10}
.code-scan{position:absolute;inset:auto 10px 9px auto;width:5px;height:5px;border-radius:99px;background:#fff;opacity:0;box-shadow:0 0 30px #fff;transition:.2s}
.gate.checking .code-scan{opacity:1;animation:pulse 1s infinite}
.gate.success .code-row input{border-color:#fff;box-shadow:0 0 0 2px #fff3}
.gate.success .code-scan{opacity:1;animation:successGlow .7s ease}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.4}50%{transform:scale(1.6);opacity:1}}
@keyframes successGlow{0%{transform:scale(.7)}100%{transform:scale(18);opacity:0}}
.err{min-height:20px;color:var(--danger);font-size:11px;margin-top:8px}
.success-line{font-size:11px;color:var(--good);min-height:18px;margin-top:4px}
.hint{font-size:10px;color:#6f6f76;margin-top:8px}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:28px}
.feature{padding:13px;border:1px solid var(--line);border-radius:14px;background:#09090b}
.feature b{display:block;font-size:12px;margin-bottom:4px}.feature span{font-size:10px;color:#75757c}

/* onboarding */
.onboard{width:min(930px,100%)}
.on-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:26px 30px 19px;border-bottom:1px solid var(--line)}
.on-head h2{margin:4px 0 0;font-size:24px}
.stepper{display:flex;gap:8px;padding:16px 30px;border-bottom:1px solid var(--line)}
.step{height:5px;flex:1;background:#202024;border-radius:999px;transition:.25s}
.step.on{background:#fff}.step.done{background:#74747b}
.on-body{padding:30px;min-height:480px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:23px}
.field label{display:block;color:#a8a8af;font-size:10px;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;border:1px solid #2a2a30;background:#09090b;color:#fff;border-radius:12px;padding:12px;outline:none}
.field textarea{min-height:98px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#76767d}
.full{grid-column:1/-1}
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:22px}
.plan-card{text-align:left;padding:17px;border:1px solid #2a2a30;border-radius:15px;background:#09090b;color:#fff;transition:.18s}
.plan-card:hover{transform:translateY(-2px);border-color:#4a4a51}
.plan-card.sel{border-color:#fff;box-shadow:inset 0 0 0 1px #fff}
.plan-card h3{margin:0;font-size:14px}.price{font-size:30px;font-weight:950;margin:7px 0}
.setup-preview{display:grid;grid-template-columns:1.2fr .8fr;gap:13px;margin-top:22px}
.preview-code{border:1px solid var(--line);border-radius:17px;background:#09090b;padding:22px}
.code-display{font-size:42px;font-weight:950;letter-spacing:.18em;margin:8px 0}
.on-foot{padding:17px 30px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}

/* app */
.shell{min-height:840px;display:grid;grid-template-columns:248px 1fr}
.sidebar{display:flex;flex-direction:column;padding:18px 14px;background:#080809;border-right:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 21px}.brand b{font-size:15px}.brand small{display:block;color:#73737a;font-size:9px;margin-top:2px}
.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:#96969d;border-radius:11px;padding:11px 12px;text-align:left;font-weight:700;display:flex;align-items:center;gap:10px}
.nav button.active,.nav button:hover{background:#151517;border-color:#25252a;color:#fff}.nav .ic{width:22px;text-align:center}
.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:13px}
.profile{display:flex;gap:9px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:14px;background:#0f0f11}
.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#fff,#777);color:#000;font-weight:900}.profile b{font-size:11px}.profile small{display:block;color:#77777d;font-size:9px;margin-top:2px}
.content{padding:23px 24px;background:linear-gradient(#0f0f11,#09090a);overflow:auto}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.topbar h1{margin:3px 0 0;font-size:28px}.actions{display:flex;gap:8px}
.page{display:none}.page.active{display:block}
.grid{display:grid;gap:13px}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.45fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
.card{background:#111113;border:1px solid var(--line);border-radius:17px;padding:16px}
.card h3{margin:0 0 12px;font-size:13px}.label{font-size:10px;color:#85858c}.value{font-size:29px;font-weight:950;margin-top:6px}.sub{font-size:9px;color:var(--good);margin-top:5px}
.mini-stat{display:flex;justify-content:space-between;align-items:end;gap:10px}.mini-stat .trend{font-size:9px;color:var(--good)}
.svg-chart{height:245px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:11px;min-width:670px}
.table th,.table td{padding:10px 8px;text-align:left;border-bottom:1px solid #202024}.table th{color:#707078;font-size:9px;text-transform:uppercase;letter-spacing:.09em}
.pill{display:inline-flex;align-items:center;padding:4px 7px;border:1px solid #303037;border-radius:99px;font-size:9px}.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}
.bars{display:flex;align-items:end;gap:10px;height:190px;padding:17px 4px 0}.bar-col{flex:1;text-align:center;font-size:9px;color:#76767d}.bar-fill{height:var(--h);min-height:8px;background:#fff;border-radius:7px 7px 2px 2px}
.bar-row{display:grid;grid-template-columns:80px 1fr 36px;gap:8px;align-items:center;font-size:10px;color:#9b9ba2}.meter{height:8px;border-radius:99px;background:#1c1c1f;overflow:hidden}.meter i{display:block;height:100%;background:#fff;border-radius:99px}
.quick{display:grid;gap:8px}.metric{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid #202024;font-size:11px}
.search{background:#0a0a0b;border:1px solid var(--line);border-radius:11px;color:#fff;padding:10px 12px;outline:0}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:13px}.toolbar-left{display:flex;gap:8px}
.empty{text-align:center;padding:32px;color:#73737a;font-size:11px}.qr-box{text-align:center;padding:18px;border:1px solid var(--line);border-radius:15px;background:#09090b}.qr-code{font-size:31px;font-weight:950;letter-spacing:.18em;margin:8px 0}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.mobile-bar{display:none}

/* modal/toast */
.modal-back{position:fixed;inset:0;background:#000c;backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;z-index:30}
.modal{width:min(650px,100%);background:#0e0e10;border:1px solid #333339;border-radius:21px;box-shadow:var(--shadow);padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal h2{font-size:19px;margin:0}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.toast{position:fixed;right:18px;bottom:18px;background:#fff;color:#000;border-radius:12px;padding:11px 14px;font-size:11px;font-weight:850;z-index:50;box-shadow:0 16px 50px #0008}
.ripple{position:fixed;width:12px;height:12px;border-radius:99px;border:1px solid #fff;pointer-events:none;transform:translate(-50%,-50%) scale(0);animation:ripple .55s ease-out forwards;z-index:100}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(24);opacity:0}}

/* responsive */
@media(max-width:1000px){
 .shell{grid-template-columns:1fr}.sidebar{display:none}.mobile-bar{display:flex;position:sticky;bottom:0;background:#0a0a0b;border-top:1px solid var(--line);padding:7px;gap:5px;z-index:8}
 .mobile-bar button{flex:1;border:0;background:transparent;color:#85858c;padding:8px 4px;font-size:9px}.mobile-bar button.active{background:#171719;color:#fff;border-radius:9px}
 .stats{grid-template-columns:1fr 1fr}.two,.three,.settings-grid,.setup-preview{grid-template-columns:1fr 1fr}
}
@media(max-width:700px){
 .app{padding:7px}.surface{border-radius:20px}.gate{padding:25px}.gate h1{font-size:32px}
 .code-row{flex-direction:column}.feature-grid,.form-grid,.plan-grid,.stats,.two,.three,.settings-grid,.setup-preview{grid-template-columns:1fr}
 .full{grid-column:auto}.on-head,.stepper,.on-foot{padding-left:20px;padding-right:20px}.on-body{padding:22px}
 .content{padding:16px}.topbar{flex-direction:column}.actions{width:100%;overflow:auto}.card{padding:14px}
 .code-display{font-size:31px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
const ACTIVATION='9A2L6E';
const STORAGE='entergym_pro_v4';
const root=document.getElementById('root');
const clone=o=>JSON.parse(JSON.stringify(o));
const DEFAULT={
 screen:'gate',page:'overview',step:1,
 gym:{name:'',location:'',phone:'',capacity:300},
 owner:{name:'',email:'',phone:''},
 gymCode:'',
 plan:{name:'Pro',price:1000,duration:30,description:'Full gym access + standard support'},
 members:[],
 attendance:[],
 customPlans:[],
 loggedIn:false
};
let S=(()=>{try{return {...clone(DEFAULT),...JSON.parse(localStorage.getItem(STORAGE)||'null')}}catch{return clone(DEFAULT)}})();
function save(){localStorage.setItem(STORAGE,JSON.stringify(S))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function initials(v){return(v||'Owner').split(/\\s+/).filter(Boolean).map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function money(v){return '₹'+Number(v||0).toLocaleString('en-IN')}
function today(){return new Date().toISOString().slice(0,10)}
function genCode(){let c;do{c=String(Math.floor(100000+Math.random()*900000))}while(c===S.gymCode);return c}
function plans(){return[{name:'Starter',price:799,duration:30,description:'Core access + attendance'},{name:'Pro',price:1000,duration:30,description:'Full access + support'},{name:'Elite',price:1499,duration:30,description:'All access + priority support'},...(S.customPlans||[])]}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
document.addEventListener('pointerdown',e=>{const r=document.createElement('span');r.className='ripple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),650)});

function render(){S.screen==='gate'?gate():S.screen==='onboard'?onboard():dashboard()}

function gate(){
root.innerHTML=`<div class="app"><div class="surface gate" id="gateBox">
<div class="logo">EG</div>
<div class="kicker" style="margin-top:18px">ENTERGYM · GYM OPERATING SYSTEM</div>
<h1>Run your gym<br>with clarity.</h1>
<p class="muted">A premium owner workspace for members, custom plans, attendance, revenue and daily operations — designed to stay simple.</p>
<div class="code-wrap"><div class="code-row"><input id="gateCode" maxlength="6" inputmode="text" autocomplete="off" placeholder="ENTER CODE"><button class="btn primary" onclick="verifyCode()">Continue</button></div><i class="code-scan"></i></div>
<div id="gateErr" class="err"></div><div id="gateSuccess" class="success-line"></div>
<div class="hint">New gym activation: <b>${ACTIVATION}</b> · Existing owner: your unique 6-digit gym code.</div>
<div class="feature-grid"><div class="feature"><b>Member OS</b><span>Add, edit and track members</span></div><div class="feature"><b>Attendance</b><span>QR-ready daily check-in flow</span></div><div class="feature"><b>Owner control</b><span>Profile, plans and settings</span></div></div>
</div></div>`;
const input=document.getElementById('gateCode');input?.focus();input?.addEventListener('keydown',e=>{if(e.key==='Enter')verifyCode()})
}
function verifyCode(){
const box=document.getElementById('gateBox'),v=(document.getElementById('gateCode').value||'').trim().toUpperCase();
document.getElementById('gateErr').textContent='';document.getElementById('gateSuccess').textContent='';
if(v!==ACTIVATION && !(S.gym.name && /^\\d{6}$/.test(v) && v===S.gymCode)){document.getElementById('gateErr').textContent='Invalid code. Please check the code and try again.';return}
box.classList.add('checking');setTimeout(()=>{box.classList.remove('checking');box.classList.add('success');document.getElementById('gateSuccess').textContent='Code verified. Opening your workspace…';setTimeout(()=>{if(v===ACTIVATION){S.screen='onboard';S.step=1;S.gymCode=''}else{S.screen='dashboard';S.page='overview';S.loggedIn=true}save();render()},650)},550)
}

function onboard(){
const body=[
`<div class="kicker">STEP 1 OF 4</div><h2>Tell us about your gym</h2><p class="muted">Create the core gym profile shown throughout your owner workspace.</p><div class="form-grid"><div class="field full"><label>Gym name</label><input id="gname" value="${esc(S.gym.name)}" placeholder="Iron House Fitness"></div><div class="field"><label>Location</label><input id="gloc" value="${esc(S.gym.location)}" placeholder="Delhi, India"></div><div class="field"><label>Phone</label><input id="gphone" value="${esc(S.gym.phone)}" placeholder="+91 98xxxxxx"></div><div class="field"><label>Member capacity</label><input id="gcap" type="number" value="${S.gym.capacity}"></div></div>`,
`<div class="kicker">STEP 2 OF 4</div><h2>Set up the owner profile</h2><p class="muted">This is the profile your gym team will see inside EnterGym.</p><div class="form-grid"><div class="field full"><label>Owner name</label><input id="oname" value="${esc(S.owner.name)}" placeholder="Alex Chauhan"></div><div class="field"><label>Email</label><input id="oemail" value="${esc(S.owner.email)}" placeholder="owner@gym.com"></div><div class="field"><label>Phone</label><input id="ophone" value="${esc(S.owner.phone)}" placeholder="+91 9xxxxxxx"></div></div>`,
`<div class="kicker">STEP 3 OF 4</div><h2>Choose your starting plan</h2><p class="muted">Your starter plan can be changed later. Custom plans are available from the dashboard.</p><div class="plan-grid">${plans().slice(0,3).map(p=>`<button class="plan-card ${S.plan.name===p.name?'sel':''}" onclick="pickPlan('${esc(p.name)}')"><h3>${esc(p.name)}</h3><div class="price">${money(p.price)} <span class="muted">/mo</span></div><div class="muted">${esc(p.description)}</div></button>`).join('')}</div>`,
`<div class="kicker">STEP 4 OF 4</div><h2>Your owner code is ready</h2><p class="muted">This unique 6-digit code will be used to reopen your gym owner workspace on this device.</p><div class="setup-preview"><div class="preview-code"><div class="kicker">UNIQUE GYM CODE</div><div class="code-display">${S.gymCode}</div><div class="muted">Keep this code saved for owner sign-in.</div></div><div class="preview-code"><div class="kicker">STARTING PLAN</div><div class="price">${money(S.plan.price)}</div><div class="muted">${esc(S.plan.name)} · ${S.plan.duration} days</div></div></div>`
][S.step-1];
root.innerHTML=`<div class="app"><div class="surface onboard"><div class="on-head"><div><div class="logo">EG</div></div><div style="flex:1"><div class="kicker">ENTERGYM SETUP</div><h2>${S.step<4?'Create your gym':'Setup complete'}</h2></div><div class="muted">Step ${S.step} / 4</div></div><div class="stepper">${[1,2,3,4].map(i=>`<i class="step ${S.step===i?'on':''} ${i<S.step?'done':''}"></i>`).join('')}</div><div class="on-body">${body}</div><div class="on-foot"><button class="btn" onclick="backSetup()" ${S.step===1?'disabled':''}>Back</button><button class="btn primary" onclick="nextSetup()">${S.step===4?'Open owner dashboard':'Continue'}</button></div></div></div>`
}
function pickPlan(n){const p=plans().find(x=>x.name===n);if(p){S.plan=clone(p);save();render()}}
function nextSetup(){
if(S.step===1){S.gym={name:document.getElementById('gname').value.trim(),location:document.getElementById('gloc').value.trim(),phone:document.getElementById('gphone').value.trim(),capacity:+document.getElementById('gcap').value||300};if(!S.gym.name)return toast('Please enter the gym name')}
if(S.step===2){S.owner={name:document.getElementById('oname').value.trim(),email:document.getElementById('oemail').value.trim(),phone:document.getElementById('ophone').value.trim()};if(!S.owner.name)return toast('Please enter the owner name')}
if(S.step===3){if(!S.gymCode)S.gymCode=genCode()}
if(S.step<4){S.step++;save();render();return}
S.screen='dashboard';S.page='overview';S.loggedIn=true;save();render();toast('Gym created successfully')}
function backSetup(){if(S.step>1){S.step--;render()}else{S.screen='gate';render()}}

function navBtn(id,label,ic){return`<button class="${S.page===id?'active':''}" onclick="go('${id}')"><span class="ic">${ic}</span>${label}</button>`}
function mobileBtn(id,ic){return`<button class="${S.page===id?'active':''}" onclick="go('${id}')">${ic}</button>`}
function dashboard(){
const titles={overview:'Owner dashboard',members:'Members',plans:'Plans & pricing',attendance:'Attendance',payments:'Payments',settings:'Settings'};
root.innerHTML=`<div class="app"><div class="surface shell">
<aside class="sidebar"><div class="brand"><div class="logo">EG</div><div><b>EnterGym</b><small>${esc(S.gym.name||'Your Gym')}</small></div></div>
<nav class="nav">${navBtn('overview','Overview','⌂')}${navBtn('members','Members','♙')}${navBtn('plans','Plans','▣')}${navBtn('attendance','Attendance','✓')}${navBtn('payments','Payments','₹')}${navBtn('settings','Settings','⚙')}</nav>
<div class="side-bottom"><div class="profile"><div class="avatar">${initials(S.owner.name)}</div><div style="flex:1"><b>${esc(S.owner.name||'Owner')}</b><small>GYM ${esc(S.gymCode||'------')}</small></div><button class="icon-btn" onclick="logout()" title="Log out">↪</button></div></div></aside>
<main class="content"><div class="topbar"><div><div class="kicker">${esc(S.gym.name||'EnterGym')} · OWNER</div><h1>${titles[S.page]||'Owner dashboard'}</h1></div><div class="actions"><button class="btn" onclick="go('members');openMemberModal()">+ Add member</button><button class="btn primary" onclick="openQR()">Attendance QR</button></div></div>
<div id="pages">${pageOverview()}${pageMembers()}${pagePlans()}${pageAttendance()}${pagePayments()}${pageSettings()}</div></main>
<div class="mobile-bar">${mobileBtn('overview','⌂')}${mobileBtn('members','♙')}${mobileBtn('plans','▣')}${mobileBtn('attendance','✓')}${mobileBtn('payments','₹')}${mobileBtn('settings','⚙')}</div>
</div></div>`;
activatePage()
}
function activatePage(){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.dataset.page===S.page))}
function go(p){S.page=p;save();render()}
function activeMembers(){return S.members.filter(m=>m.status!=='inactive')}
function pageOverview(){
const act=activeMembers().length,rev=activeMembers().reduce((n,m)=>n+(+m.price||0),0),tod=S.attendance.filter(a=>a.date===today()).length,cap=S.gym.capacity||300;
return`<section class="page ${S.page==='overview'?'active':''}" data-page="overview">
<div class="grid stats"><div class="card"><div class="label">ACTIVE MEMBERS</div><div class="value">${act}</div><div class="sub">Live member base</div></div><div class="card"><div class="label">EST. MRR</div><div class="value">${money(rev)}</div><div class="sub">Based on active plans</div></div><div class="card"><div class="label">TODAY CHECK-INS</div><div class="value">${tod}</div><div class="sub">Recorded today</div></div><div class="card"><div class="label">CAPACITY</div><div class="value">${Math.round(act/Math.max(1,cap)*100)}%</div><div class="sub">${Math.max(0,cap-act)} spots available</div></div></div>
<div class="grid two" style="margin-top:13px"><div class="card"><div class="split"><h3>Attendance trend</h3><span class="muted">Last 7 days</span></div><div class="bars">${[6,4,7,5,8,6,9].map((n,i)=>`<div class="bar-col"><div class="bar-fill" style="--h:${n*15}px"></div><div>D${i+1}</div></div>`).join('')}</div></div>
<div class="card"><h3>Plan mix</h3><div style="display:grid;gap:12px">${plans().map(p=>{const n=activeMembers().filter(m=>m.plan===p.name).length;return`<div class="bar-row"><span>${esc(p.name)}</span><div class="meter"><i style="width:${act?Math.min(100,n/act*100):0}%"></i></div><b>${n}</b></div>`}).join('')}</div><div class="qr-box" style="margin-top:16px"><div class="kicker">GYM CODE</div><div class="qr-code">${esc(S.gymCode)}</div><div class="muted">Owner sign-in code</div></div></div></div>
<div class="grid three" style="margin-top:13px"><div class="card"><h3>Recent members</h3>${(S.members.slice(-4).reverse().map(m=>`<div class="metric"><span>${esc(m.name)}</span><b>${esc(m.plan)}</b></div>`).join(''))||'<div class="empty">No members yet.</div>'}</div><div class="card"><h3>Quick actions</h3><div class="quick"><button class="btn" onclick="go('members');openMemberModal()">+ Add member</button><button class="btn" onclick="go('plans');openPlanModal()">+ Create plan</button><button class="btn" onclick="openQR()">Open attendance QR</button></div></div><div class="card"><h3>Workspace</h3><div class="metric"><span>Gym</span><b>${esc(S.gym.name)}</b></div><div class="metric"><span>Owner</span><b>${esc(S.owner.name)}</b></div><div class="metric"><span>Plan</span><b>${esc(S.plan.name)}</b></div></div></div>
</section>`
}
function pageMembers(){
const q=(S.memberSearch||'').toLowerCase(),items=S.members.filter(m=>(m.name+' '+m.phone+' '+m.plan).toLowerCase().includes(q));
return`<section class="page ${S.page==='members'?'active':''}" data-page="members"><div class="card"><div class="toolbar"><div class="toolbar-left"><input class="search" placeholder="Search members…" value="${esc(S.memberSearch||'')}" oninput="S.memberSearch=this.value;refreshMembers()"></div><button class="btn primary" onclick="openMemberModal()">+ Add member</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Plan</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody>${items.length?items.map((m,i)=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.phone)}</td><td>${esc(m.plan)}</td><td>${money(m.price)}</td><td><span class="pill ${m.status==='inactive'?'warn':'good'}">${m.status}</span></td><td><button class="btn" onclick="toggleMember(${S.members.indexOf(m)})">${m.status==='inactive'?'Activate':'Pause'}</button> <button class="btn danger" onclick="deleteMember(${S.members.indexOf(m)})">Delete</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">No members found.</div></td></tr>`}</tbody></table></div></div></section>`
}
function refreshMembers(){const box=document.getElementById('pages');if(!box)return;const temp=S.page;render();S.page=temp}
function openMemberModal(index=null){
const m=index===null?null:S.members[index];
modal(`<div class="modal-head"><h2>${m?'Edit':'Add'} member</h2><button class="icon-btn" onclick="closeModal()">×</button></div>
<div class="form-grid"><div class="field full"><label>Member name</label><input id="mm_name" value="${esc(m?.name)}" placeholder="Rahul Sharma"></div><div class="field"><label>Phone</label><input id="mm_phone" value="${esc(m?.phone)}" placeholder="+91..."></div><div class="field"><label>Email</label><input id="mm_email" value="${esc(m?.email)}" placeholder="member@email.com"></div><div class="field"><label>Plan</label><select id="mm_plan">${plans().map(p=>`<option ${m?.plan===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Monthly price</label><input id="mm_price" type="number" value="${m?.price??S.plan.price}"></div></div>
<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveMember(${index===null?'null':index})">Save member</button></div>`)
}
function saveMember(i){
const name=document.getElementById('mm_name').value.trim();if(!name)return toast('Enter member name');
const member={name,phone:document.getElementById('mm_phone').value.trim(),email:document.getElementById('mm_email').value.trim(),plan:document.getElementById('mm_plan').value,price:+document.getElementById('mm_price').value||0,status:'active',created:Date.now()};
if(i===null)S.members.push(member);else S.members[i]={...S.members[i],...member};save();closeModal();render();toast(i===null?'Member added':'Member updated')
}
function toggleMember(i){S.members[i].status=S.members[i].status==='inactive'?'active':'inactive';save();render();toast('Member status updated')}
function deleteMember(i){if(!confirm('Delete this member?'))return;S.members.splice(i,1);save();render();toast('Member deleted')}

function pagePlans(){return`<section class="page ${S.page==='plans'?'active':''}" data-page="plans"><div class="grid three">${plans().map((p,i)=>`<div class="card"><div class="kicker">${i<3?'CORE':'CUSTOM'}</div><h3 style="margin-top:7px">${esc(p.name)}</h3><div class="price">${money(p.price)} <span class="muted">/mo</span></div><p class="muted">${esc(p.description||'Custom membership plan')}</p><button class="btn" onclick="openPlanModal(${i})">Edit</button> ${i>=3?`<button class="btn danger" onclick="deletePlan(${i-3})">Delete</button>`:''}</div>`).join('')}<div class="card"><div class="kicker">CUSTOM</div><h3 style="margin-top:7px">Build a new plan</h3><p class="muted">Create custom pricing and positioning for your members.</p><button class="btn primary" onclick="openPlanModal()">+ Create custom plan</button></div></div></section>`}
function openPlanModal(index=null){
const p=index===null?null:plans()[index];
modal(`<div class="modal-head"><h2>${p?'Edit plan':'Create custom plan'}</h2><button class="icon-btn" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field full"><label>Plan name</label><input id="pp_name" value="${esc(p?.name)}" placeholder="Premium"></div><div class="field"><label>Monthly price</label><input id="pp_price" type="number" value="${p?.price??1200}"></div><div class="field"><label>Duration (days)</label><input id="pp_days" type="number" value="${p?.duration??30}"></div><div class="field full"><label>Description</label><textarea id="pp_desc">${esc(p?.description||'Custom access plan')}</textarea></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePlan(${index===null?'null':index})">Save plan</button></div>`)
}
function savePlan(i){
const p={name:document.getElementById('pp_name').value.trim(),price:+document.getElementById('pp_price').value||0,duration:+document.getElementById('pp_days').value||30,description:document.getElementById('pp_desc').value.trim()};
if(!p.name)return toast('Enter plan name');
const core=['Starter','Pro','Elite'];
if(i===null){S.customPlans.push(p)}else if(i<3){if(core[i]!==p.name)toast('Core plan names stay fixed in this MVP');S.plan=S.plan.name===plans()[i].name?p:S.plan}else{S.customPlans[i-3]=p}
save();closeModal();render();toast('Plan saved')
}
function deletePlan(i){if(confirm('Delete this custom plan?')){S.customPlans.splice(i,1);save();render();toast('Plan deleted')}}

function pageAttendance(){const log=[...S.attendance].reverse();return`<section class="page ${S.page==='attendance'?'active':''}" data-page="attendance"><div class="grid two"><div class="card"><h3>Today</h3><div class="value">${S.attendance.filter(a=>a.date===today()).length}</div><p class="muted">Check-ins recorded today.</p><button class="btn primary" onclick="manualCheckin()">Manual check-in</button></div><div class="card"><h3>QR attendance</h3><div class="qr-box"><div class="kicker">OWNER GYM CODE</div><div class="qr-code">${esc(S.gymCode)}</div><p class="muted">Open the QR panel to share the attendance flow.</p><button class="btn" onclick="openQR()">Generate / view QR</button></div></div></div><div class="card" style="margin-top:13px"><h3>Attendance log</h3><div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Date</th><th>Time</th><th>Method</th></tr></thead><tbody>${log.length?log.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.date)}</td><td>${esc(a.time)}</td><td><span class="pill">${esc(a.method||'owner')}</span></td></tr>`).join(''):`<tr><td colspan="4"><div class="empty">No attendance yet.</div></td></tr>`}</tbody></table></div></div></section>`}
function manualCheckin(){
if(!S.members.length)return toast('Add a member first');
const names=S.members.map((m,i)=>`${i+1}. ${m.name}`).join('\\n');const raw=prompt('Choose member number:\\n'+names);const idx=Number(raw)-1;if(!Number.isInteger(idx)||!S.members[idx])return;
const m=S.members[idx];S.attendance.push({memberId:idx,name:m.name,date:today(),time:new Date().toLocaleTimeString(),method:'owner'});save();render();toast('Attendance recorded')
}
function openQR(){
modal(`<div class="modal-head"><h2>Attendance QR</h2><button class="icon-btn" onclick="closeModal()">×</button></div><div class="qr-box"><div id="qrCanvas"></div><div class="qr-code">${esc(S.gymCode)}</div><p class="muted">For a production QR image, connect this screen to your backend/public attendance URL. The unique gym code is already ready.</p><button class="btn primary" onclick="navigator.clipboard?.writeText('${esc(S.gymCode)}');toast('Gym code copied')">Copy gym code</button></div>`)}
function pagePayments(){const rev=activeMembers().reduce((n,m)=>n+(+m.price||0),0);return`<section class="page ${S.page==='payments'?'active':''}" data-page="payments"><div class="grid stats"><div class="card"><div class="label">EST. MRR</div><div class="value">${money(rev)}</div><div class="sub">Active member plans</div></div><div class="card"><div class="label">ACTIVE BILLING</div><div class="value">${activeMembers().length}</div><div class="sub">Members with plans</div></div><div class="card"><div class="label">AVG. PLAN</div><div class="value">${money(activeMembers().length?rev/activeMembers().length:0)}</div><div class="sub">Average monthly value</div></div><div class="card"><div class="label">PRICE POINT</div><div class="value">${money(S.plan.price)}</div><div class="sub">Starting plan</div></div></div><div class="card" style="margin-top:13px"><h3>Payment system</h3><p class="muted">This product screen is prepared for a payment gateway integration. Live payment capture should be wired to your server and webhook provider before real-money use.</p><button class="btn primary" onclick="toast('Payment gateway integration slot is ready')">Open integration slot</button></div></section>`}
function pageSettings(){return`<section class="page ${S.page==='settings'?'active':''}" data-page="settings"><div class="settings-grid"><div class="card"><h3>Gym profile</h3><div class="field"><label>Name</label><input id="sg_name" value="${esc(S.gym.name)}"></div><div class="field" style="margin-top:12px"><label>Location</label><input id="sg_loc" value="${esc(S.gym.location)}"></div><div class="field" style="margin-top:12px"><label>Phone</label><input id="sg_phone" value="${esc(S.gym.phone)}"></div><div class="field" style="margin-top:12px"><label>Capacity</label><input id="sg_cap" type="number" value="${S.gym.capacity}"></div><button class="btn primary" style="margin-top:14px" onclick="saveGym()">Save gym</button></div><div class="card"><h3>Owner profile</h3><div class="field"><label>Name</label><input id="so_name" value="${esc(S.owner.name)}"></div><div class="field" style="margin-top:12px"><label>Email</label><input id="so_email" value="${esc(S.owner.email)}"></div><div class="field" style="margin-top:12px"><label>Phone</label><input id="so_phone" value="${esc(S.owner.phone)}"></div><button class="btn primary" style="margin-top:14px" onclick="saveOwner()">Save profile</button></div><div class="card"><h3>Account & access</h3><div class="metric"><span>Gym code</span><b>${esc(S.gymCode)}</b></div><div class="metric"><span>Activation</span><b>Verified</b></div><button class="btn" style="margin-top:12px" onclick="regenerateCode()">Generate new 6-digit code</button></div><div class="card"><h3>Session</h3><p class="muted">Log out from this device and return to the verification screen.</p><button class="btn danger" onclick="logout()">Log out</button></div></div></section>`}
function saveGym(){S.gym.name=document.getElementById('sg_name').value.trim();S.gym.location=document.getElementById('sg_loc').value.trim();S.gym.phone=document.getElementById('sg_phone').value.trim();S.gym.capacity=+document.getElementById('sg_cap').value||300;save();render();toast('Gym profile saved')}
function saveOwner(){S.owner.name=document.getElementById('so_name').value.trim();S.owner.email=document.getElementById('so_email').value.trim();S.owner.phone=document.getElementById('so_phone').value.trim();save();render();toast('Owner profile saved')}
function regenerateCode(){S.gymCode=genCode();save();render();toast('New 6-digit gym code generated')}
function logout(){S.screen='gate';S.loggedIn=false;S.page='overview';save();render();toast('Logged out')}

function modal(content){const x=document.createElement('div');x.id='modalBack';x.className='modal-back';x.innerHTML=`<div class="modal">${content}</div>`;document.body.appendChild(x)}
function closeModal(){document.getElementById('modalBack')?.remove()}

render();
</script>
</body>
</html>
